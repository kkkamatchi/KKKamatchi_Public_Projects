repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: block-raw-market-data
        name: block raw market data
        entry: uv run python tools/ci/check_raw_data.py
        language: system
        pass_filenames: true
      - id: licence-gate
        name: licence gate
        entry: uv run python tools/ci/licence_gate.py
        language: system
        pass_filenames: false
        files: (provenance\.toml|licences/sources\.toml)$
