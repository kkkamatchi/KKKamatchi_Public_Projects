name: market-ml

on:
  push:
    branches: [main]
    paths:
      - "market-ml/**"
      - ".github/workflows/market-ml.yml"
      - ".pre-commit-config.yaml"
      - ".raw-data-allow"
  pull_request:
    paths:
      - "market-ml/**"
      - ".github/workflows/market-ml.yml"
      - ".pre-commit-config.yaml"
      - ".raw-data-allow"

permissions:
  contents: read

defaults:
  run:
    working-directory: market-ml

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: market-ml/uv.lock
      - name: Install workspace
        run: uv sync --locked
      - name: Lint, typecheck, test, data guards
        run: make ci
      - name: Pre-commit hooks (private keys, whitespace, the same guards)
        run: uv run pre-commit run --all-files --show-diff-on-failure
