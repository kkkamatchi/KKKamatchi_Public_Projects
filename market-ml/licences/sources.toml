# Data-source registry read by tools/ci/licence_gate.py.
#
# status         ok: cleared for the kinds listed; verify: blocked until someone reads
#                the current terms and flips it to ok; denied: never published from here
#                unless written permission is recorded in permission_ref.
# allowed_kinds  artifact kinds this source may feed:
#                  reference-facts  rates, rules and schedules cited from public documents
#                  dataset          redistributed or derived data
#                  weights          trained model weights
#                  metrics          published evaluation numbers
# share_alike    licence every artifact built from this source must carry.
#
# Terms were read on the dates in `checked`. They change: re-read before each release.

