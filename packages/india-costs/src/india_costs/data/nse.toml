# Statutory and exchange charges on NSE equity trades, by trade date.
#
# rate     fraction of the basis, as a string (0.1% = "0.001"; Rs 10 per crore = "0.000001")
# basis    trade value (price x quantity); option premium x quantity for equity_options
# start    first trade date the rate applies; end: last trade date (omit while in force)
# segment  one segment or "*"; side: "buy", "sell" or "both"; exchange: "NSE" or "*"
#
# Every component/segment/side must resolve to exactly one rate on every date from
# coverage_start to as_of; load_table() rejects gaps and overlaps. Each entry cites
# the primary source it was checked against on the as_of date.

schema_version = 1
as_of = 2026-11-03
coverage_start = 2020-07-01

